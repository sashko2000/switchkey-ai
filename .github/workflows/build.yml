name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build KeyboardSwitcher.sln -c Release
      - name: Unit tests (layout detection, model logic with fake models and servers)
        run: dotnet test tests/KeyboardSwitcher.Tests -c Release --logger "console;verbosity=normal"
      - name: Publish
        run: ./build.ps1 -Zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardSwitcher
          path: dist/KeyboardSwitcher.zip