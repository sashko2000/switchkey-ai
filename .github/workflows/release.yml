name: release

# Runs when a version tag is pushed: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/KeyboardSwitcher.Tests -c Release
      - name: Publish
        run: ./build.ps1 -Zip
        shell: pwsh
      - name: Name the files after the version
        run: |
          Rename-Item dist/KeyboardSwitcher.zip "KeyboardSwitcher-${{ github.ref_name }}-win-x64.zip"
          Copy-Item dist/KeyboardSwitcher/KeyboardSwitcher.exe "dist/KeyboardSwitcher-${{ github.ref_name }}-win-x64.exe"
        shell: pwsh
      - name: Create the GitHub release (single exe + zip with licenses)
        run: gh release create "${{ github.ref_name }}" "dist/KeyboardSwitcher-${{ github.ref_name }}-win-x64.exe" "dist/KeyboardSwitcher-${{ github.ref_name }}-win-x64.zip" --title "${{ github.ref_name }}" --generate-notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}